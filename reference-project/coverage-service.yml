notify:
    after_n_builds: 1

# Each flag is judged on its own upload, so the frontend report never moves the PHP gate.
flags:
    php:
        paths:
            - app/
        carryforward: false
    frontend:
        paths:
            - resources/js/
        carryforward: true

coverage:
    status:
        project:
            default:
                target: auto
                threshold: 0.25%
                flags:
                    - php
            frontend:
                informational: true
                flags:
                    - frontend
        # A hard gate: a change without coverable PHP lines (docs, tests, frontend) passes it by definition.
        patch:
            default:
                target: auto
                threshold: 2%
                flags:
                    - php
            frontend:
                informational: true
                flags:
                    - frontend

comment:
    after_n_builds: 1
