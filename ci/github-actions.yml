# Skeleton for GitHub Actions. Replace every <placeholder>. Copy this file to .github/workflows/kit-checks.yml: it is a file of its
# own, always. The on: block belongs to the whole file and a job runs on every event of that file, so a project's existing
# workflow is never edited: adding pull_request and schedule to its ci.yml would run its deploy job on every pull request and
# every night, with the secrets a same-repository pull request can read. The existing workflow keeps its push trigger and its
# deploy; its own test jobs move into this file (a suite runs once per trigger, 04-guards.md C4, point 19). A deploy that must
# wait for these jobs is a workflow with on: workflow_run (workflows: [Kit checks], types: [completed]) whose jobs carry
# if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' and a branch check on
# github.event.workflow_run.head_branch; or it is a job in this file with needs: [checks-main, backend-tests, frontend-tests,
# smoke] and if: github.event_name == 'push'. Never check out and run pull-request code from a workflow_run or
# pull_request_target workflow: they run with secrets.
#
# Two forms of this file. This one runs every job in a container pinned by digest (the project's CI image). ci/github-actions-runner.yml
# runs the jobs on the runner with setup-php and setup-node and has no image: use it where no such image exists (a first run, a small
# repository). Pick one per repository, never both; the contract test reads either (04-guards.md C4, points 7 and 10).
#
# The checks job is a matrix over the parts of PARTS in scripts/checks.sh (bash scripts/checks.sh --list-parts): one entry per part.
# The pull_request trigger has no path filter: the checks job runs on every pull request, a docs-only one too.
# A path filter may go on a test job, never on the checks job. No job commits or pushes.
#
# Merge-first, as on Bitbucket: a pull_request run checks out GitHub's merge ref (the pull request merged into the base as it is
# when the run starts), so HEAD is that merge, the ratchets compare it with the base, and CHECK_HEAD is never set here. Every
# job checks out the same ref, so one pull request is judged on one tree. The merge ref is made when the event fires and is not
# made again when the base moves later: the repository setting "Require branches to be up to date before merging" is what makes
# the last merge the one that was tested. A push to a deploying branch checks out that branch, which is what --main wants.
# No merge queue: this file has no merge_group trigger, on purpose, and a project must not turn the queue on for a branch that
# requires these checks (a required check that never reports on the queue's ref blocks every merge). Reason: on a merge_group
# event GITHUB_BASE_REF is empty (the base is in github.event.merge_group.base_ref, with the refs/heads/ prefix), and the commit
# range base..HEAD of a queued ref holds the commits of every pull request queued before it, so the override tags, the commit
# messages and the guarded-file check would judge other pull requests' commits against this one. Supporting the queue needs a
# change in ci-ratchets.sh (the range of one pull request on a queue ref), not only a trigger here.
# The retarget of a stacked pull request (07-process.md section 9) fires "edited" with changes.base: the type is listed, and the
# concurrency group cancels the run it replaces. An edit of the title or the description starts a run too; that is the price.
# Do not set persist-credentials: false on the checkout: checks.sh fetches the base with the credentials the checkout leaves.
# Do not add secrets to the env of the checks job: the job runs the pull request's own scripts.
# The files that carry the guards, this one included, need the review of an owner who is a person (ci/CODEOWNERS.example). A pull
# request runs its own copy of this file, so that review is the only barrier for a change to the workflow itself; without it
# the guard of this file is advice (04-guards.md C4, point 22).
#
# Required status checks (Settings, Branches, the rule of the main branch and of every other deploying branch): require
# checks-result, backend-tests, frontend-tests and smoke, not the four "checks (<part>)" names. A new part of PARTS is then
# required without anyone editing the rule, and a name can be picked only after it ran once (open a draft pull request first).
# Unenforced mode: a private repository on a free plan has no branch protection, no ruleset and no enforced code owners (the API
# answers 403 "Upgrade to GitHub Pro", observed on one repository). Nothing then stops a merge, so the lead merges only when
# gh pr checks shows every check green, the aggregate checks-result included; CODEOWNERS stays in the repository and point 22 reads
# the file only; the profile says what is not enforced (07-process.md section 12). The skeleton is the same in both modes.
# Everything runs inside one image pinned by digest (container:), as on the other hosts, so baselines and analyser results
# do not move with the runner image; the label ubuntu-24.04 only names the machine that starts the container. A service of a
# container job is reached by its name: DB_HOST=database (GitLab: the same alias).
#
# THE IMAGE (nothing in GitHub supplies it; it is the project's). Where it comes from: one image that holds the project's PHP with
# its extensions, Composer, Node and the tools below. ci/ci-image.Dockerfile.example is a starting point. Build it in the
# repository (a Dockerfile under docker/ci/), publish it to a registry the runner can read, take its digest from the registry
# (the page of the package, or "docker buildx imagetools inspect <image>:<tag>") and write image: <name>@sha256:<digest>. The
# guard fails a container without a digest. The dependency bot (templates/tool-configs.md) keeps the digest current.
#   What the image must hold: bash, git 2.18 or newer (older, or none: actions/checkout falls back to a download without history
#   and fetch-depth: 0 does nothing), curl, tar, sha256sum (coreutils), ca-certificates, a glibc distribution (Debian or Ubuntu;
#   an Alpine image is a known trouble spot for the runner's own Node, UNVERIFIED), and for the scheduled job gh (the job
#   installs a pinned one when the image has none).
#   User: the install step of gitleaks writes /usr/local/bin and the runner mounts its work folders into the container, so the
#   image runs as root (no USER line in the Dockerfile), or the job says  options: --user root  under container:. A non-root
#   image needs its own install path and is not covered here (UNVERIFIED on a runner).
#   A private image (for example ghcr.io/<owner>/<image>): the workflow token needs permissions: packages: read and every
#   container: block needs credentials, both shown commented below (once, in the first block). A public image needs neither. A pull request from a fork gets a
#   read-only token and cannot pull a private image with it (UNVERIFIED); this file does not support pull requests from forks.
#   Without an image of its own: use the runner form, ci/github-actions-runner.yml (setup-php and setup-node pinned by sha, no
#   registry, no digest, gh and git preinstalled). It gives up the digest-pinned toolchain, which is an owner exception to point 7
#   of 04-guards.md C4 and goes in the profile; the baselines are then made on the same runner image label. The image placeholder
#   below is what the guard reads in this form.
# Actions minutes: read the plan and what is left before the schedule is chosen (04-guards.md C4, "GitHub Actions cost"). A whole-tree
# mutation run every night can break a free allowance by itself. The weekly variant keeps the daily dashboard run and moves the
# mutation line to a cron of its own: add a second entry under schedule:  - cron: '23 4 * * 0'  (Sunday, an odd minute), and put
#   if: github.event.schedule == '23 4 * * 0'
# on the step  - run: bash scripts/mutation.sh  of the scheduled job. The contract test accepts that condition when the cron is
# one of the crons of the file, and nothing else (a condition that is never true would switch the run off unseen).
# The scheduled run: schedule fires only from the default branch's copy of this file, in UTC, and can start late at the top of
# the hour (hence the odd minute); in a public repository GitHub switches it off after 60 days without activity, and the
# person who last edited the cron is notified of a failed run. There is no manual trigger: "Re-run jobs" in the UI is the way.
# Pin every action to a full commit sha with a comment of its release (# v7.0.1); the dependency bot keeps them current
# (templates/tool-configs.md). Look the sha up and never type one from memory: gh api repos/<owner>/<repo>/tags --jq '.[0:4][] | .name + " " + .commit.sha'
# prints the newest tags with the commit each points at (an annotated tag included; floating tags such as v7 are in the list too:
# take the release, not the floating name). gh api repos/<owner>/<repo>/git/ref/tags/<tag> answered 404 for some tags and, for an
# annotated one, gives a tag object, not the commit. Use a release whose action.yml says
# using: node24: GitHub's changelog says the runners no longer offer Node 20, and what a node20 action does there is UNVERIFIED.
# Full history (fetch-depth: 0) on every checkout: the guard group reads history too (point 6).
# No secrets.* anywhere in this file (the guard fails one); the token of a job is the workflow token, github.token.
# A run of the same pull request that GitHub cancels (an older run, replaced by a newer one) still runs checks-result, which then
# reports a failure for that older run until the newer one reports; whether the merge box ever shows it is UNVERIFIED. If it does,
# set cancel-in-progress to  github.event_name == 'pull_request' && github.event.action != 'edited'  (an edit then queues).
# Step 9 of the program adds to backend-tests, on pull requests only: bash scripts/mutation.sh --changed (CHECK_BASE is set).
# A project without a database leaves the services blocks and DB_HOST out.

# Speed (04-guards.md C4, "CI speed"): cache the dependency directories and downloaded tools by the hash of the lock file,
# keep the analyser's result cache between builds (not the type-aware lint cache), run independent jobs side by side, and
# switch the package manager's process timeout off for the long scripts (Composer: Composer\Config::disableProcessTimeout).
# A formatter config that the organisation hosts as a URL stays a URL: download it once per run (cached), never commit it.
# Every branch that deploys gets the "on a deploying branch" runs, not only the main branch, and each suite runs once per
# trigger before the deploy step.
# The audit of a deploying branch covers production dependencies only (--omit=dev); the pull request and the scheduled run
# audit everything.
# Dependency cache: an actions/cache step (pinned by commit sha) keyed by the hash of the lock file, before the install step.

name: Kit checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['<main branch>', '<other deploying branch>']
  schedule:
    - cron: '<cron expression: once a day, at an odd minute, for example 17 3>'

concurrency:
  group: kit-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # A private image from the GitHub registry also needs:  packages: read  (and credentials: under container:, see "THE IMAGE").

defaults:
  run:
    shell: bash

jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: <maximum minutes>
    container:
      image: <image name>@sha256:<digest> # the project's CI image, or a public image of its PHP version; see THE IMAGE above
      # credentials:                    # a private image only (and permissions: packages: read above)
      #   username: ${{ github.actor }}
      #   password: ${{ secrets.GITHUB_TOKEN }}
      # options: --user root            # when the image's own user is not root
    strategy:
      fail-fast: false
      matrix:
        part: [gate, static, guards, repo]
    env:
      CHECK_BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@<40-character commit sha of the release the project pins> # <release, for example v7.0.1>
        with:
          fetch-depth: 0
      - run: <install dependencies from the lock file>
      # The container runs as root, so install needs no sudo. A job on the runner (ci/github-actions-runner.yml) runs as a user that
      # cannot write /usr/local/bin: there the line is  sudo install -m 0755 gitleaks /usr/local/bin/gitleaks  (observed: it fails
      # without). The checksum of the tarball is in gitleaks_<version>_checksums.txt of the release (the file name carries the version).
      - name: Install gitleaks
        if: matrix.part == 'repo' # the part that holds the Secret scan of PARTS: move this condition with that task
        env:
          GITLEAKS_VERSION: <version, for example 8.30.1>
          GITLEAKS_SHA256: <sha256 of the linux_x64 tarball, copied from gitleaks_<version>_checksums.txt of that release>
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tgz gitleaks
      - run: bash scripts/checks.sh --part ${{ matrix.part }}

  checks-result:
    if: always() && github.event_name == 'pull_request'
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the checks run passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success

  checks-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: <maximum minutes>
    container:
      image: <image name>@sha256:<digest> # the project's CI image, or a public image of its PHP version; see THE IMAGE above
    strategy:
      fail-fast: false
      matrix:
        part: [gate, static, guards, repo]
    steps:
      - uses: actions/checkout@<40-character commit sha of the release the project pins> # <release, for example v7.0.1>
        with:
          fetch-depth: 0
      - run: <install dependencies from the lock file>
      - run: bash scripts/checks.sh --main --part ${{ matrix.part }}

  backend-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: <maximum minutes>
    container:
      image: <image name>@sha256:<digest> # the project's CI image, or a public image of its PHP version; see THE IMAGE above
    env:
      CHECK_BASE: ${{ github.base_ref }}
      DB_HOST: database
    services:
      database:
        image: <the image of DATABASE_IMAGE in scripts/kit-config.sh>
        # The variable and the health command follow the engine of that image (04-guards.md C4, point 10; the guard reads the
        # engine from DATABASE_IMAGE). The official images exit at start without their password variable, and GitHub then fails
        # the job at "Initialize containers", before a step runs. Keep the pair of the engine, delete the others (the same in
        # every services block of this file); a container job reaches the service by name on its default port, no ports: needed.
        #   postgres  POSTGRES_PASSWORD: ci          health  pg_isready -h 127.0.0.1 -U postgres      (user postgres)
        #   mysql     MYSQL_ROOT_PASSWORD: ci        health  mysqladmin ping -h 127.0.0.1 -uroot -pci      (user root)
        #   mariadb   MARIADB_ROOT_PASSWORD: ci      health  healthcheck.sh --connect --innodb_initialized (user root)
        #   mongo     no variable needed             health  mongosh --quiet --eval "db.runCommand({ping:1})"      (mongo:8 holds mongosh)
        #   redis     no variable needed             health  redis-cli ping      (a second service beside the database, named as
        #             an auxiliary image in the contract test; DATABASE_IMAGE can hold only the database)
        # A MongoDB or Redis application reads its host from its own variable (MONGODB_URI, REDIS_HOST): set it by the service name
        # here, and the contract test takes that variable name as an argument instead of DB_HOST. ci/github-actions-runner.yml has the
        # same blocks with ports for a job on the runner.
        # The mysql and mariadb pairs are the images' documented variables and health tools, UNVERIFIED on a runner; the postgres
        # pair is the documented one too. A project without a database has no services block and no DB_HOST.
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@<40-character commit sha of the release the project pins> # <release, for example v7.0.1>
        with:
          fetch-depth: 0
      - run: <install dependencies from the lock file>
      - run: <backend test command, writing a clover coverage report>
      - run: bash scripts/checks.sh --coverage <path of the clover report> # holds the coverage at the committed floor (tools/README.md, "Coverage")

  frontend-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: <maximum minutes>
    container:
      image: <image name>@sha256:<digest> # the project's CI image, or a public image of its PHP version; see THE IMAGE above
    steps:
      - uses: actions/checkout@<40-character commit sha of the release the project pins> # <release, for example v7.0.1>
        with:
          fetch-depth: 0
      - run: <install dependencies from the lock file>
      - run: <frontend test command, with coverage held at the committed floor (tools/README.md, "Coverage")>

  smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: <maximum minutes>
    container:
      image: <image name>@sha256:<digest> # the project's CI image, or a public image of its PHP version; see THE IMAGE above
    env:
      DB_HOST: database
    services:
      database:
        image: <the image of DATABASE_IMAGE in scripts/kit-config.sh>
        # the variable and the health command of the engine, as in backend-tests
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@<40-character commit sha of the release the project pins> # <release, for example v7.0.1>
        with:
          fetch-depth: 0
      - run: <install dependencies from the lock file>
      # The production drivers, not the production environment: where the application forces https in production (a URL::forceHttps()
      # call), a stack served over plain http renders blank pages (assets on https). Boot it with APP_ENV=staging and the drivers
      # of production (cache store, queue, database engine) set by name, and let the smoke suite assert the drivers.
      - run: <boot the stack with seeded data and the production drivers (cache store, queue, database engine)>
      - run: <smoke suite command, in a browser where the project has a frontend, after installing that browser at a pinned version>

  scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: <maximum minutes>
    container:
      image: <image name>@sha256:<digest> # the project's CI image, or a public image of its PHP version; see THE IMAGE above
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DB_HOST: database
    services:
      database:
        image: <the image of DATABASE_IMAGE in scripts/kit-config.sh>
        # the variable and the health command of the engine, as in backend-tests
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@<40-character commit sha of the release the project pins> # <release, for example v7.0.1>
        with:
          fetch-depth: 0
      - run: <install dependencies from the lock file>
      # The dashboard row for the CI duration runs "gh run list" (GH_TOKEN, GH_REPO and actions: read above). Hosted runners carry gh,
      # a container does not unless its image holds it: without gh the row reads "?" and says nothing else. Pin the version and
      # check the download, as for gitleaks; delete the step when the image has gh.
      - name: Install gh
        env:
          GH_VERSION: <version, for example 2.106.0>
          GH_SHA256: <sha256 of the linux_amd64 tarball, copied from gh_<version>_checksums.txt of that release>
        run: |
          command -v gh > /dev/null && exit 0
          curl -sSfL -o gh.tgz "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  gh.tgz" | sha256sum -c -
          tar -xzf gh.tgz --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"
          install -m 0755 gh /usr/local/bin/gh
          rm gh.tgz gh
      - run: bash scripts/checks.sh --scheduled
      - run: bash scripts/mutation.sh
