# The kit's OWN CI: it runs in the kit repository and is not a template for a project (the project's skeleton is ci/github-actions.yml).
# It lints every script and runs the proof suite (tools/proof/proof.sh) on Linux and on macOS, where /bin/bash
# is bash 3.2: the tools must run there.
#
# Action pins: every action is pinned to a full commit sha with its release in a comment. The three shas below were looked up
# through the GitHub API (git/ref/tags/<tag>, an annotated tag followed to its commit) on 2026-11-26. Re-verify one before
# changing it; never type a sha from memory.
#   actions/checkout        v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node      v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
#   shivammathur/setup-php  2.40.0  eb7c497e18156a6bbabfef1d3a82760b9eda3962
# All three declare `using: node24` in their action.yml (read through the API on the same day): the older pins (checkout v4.2.2, setup-node
# v4.4.0, setup-php 2.32.0) were node20 actions, and GitHub's changelog says the runners no longer offer Node 20. UNVERIFIED on a runner: what a node20
# action does there (a warning, a forced run on Node 24, or a failure); the pins above avoid the question.
# jq is on both hosted runner images; the "Tools" step prints its version and installs it (apt, brew) only when it is missing.
# The workflow itself has not been run on a runner yet: the first run on a pull request is its proof.

name: Kit proof

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: kit-proof-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'
      - name: bash -n on every script
        run: |
          status=0
          for file in $(git ls-files '*.sh'); do
            /bin/bash -n "$file" || status=1
          done
          exit "$status"
      - name: node --check on the TypeScript mover
        run: node --check tools/move-ts.mjs
      - name: php -l on the example and fixture PHP
        run: |
          status=0
          for file in $(git ls-files 'reference-project/*.php' 'tools/proof/fixtures/*.php'); do
            php -l "$file" > /dev/null || { echo "php -l failed: $file"; status=1; }
          done
          exit "$status"

  proof:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'
      - name: Tools
        run: |
          command -v jq > /dev/null || { if [ "$RUNNER_OS" = macOS ]; then brew install jq; else sudo apt-get install -y jq; fi; }
          jq --version
          php --version | head -n 1
          node --version
          /bin/bash --version | head -n 1
      - name: Proof suite with the system bash
        env:
          PROOF_OUT: ${{ runner.temp }}/proof
        run: |
          mkdir -p "$PROOF_OUT"
          /bin/bash tools/proof/proof.sh /bin/bash
